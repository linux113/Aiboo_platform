[AIBOO]
; ---------------------------------------------------------------------------
; AiBoO agent settings. install_service.bat / run_agent.bat ask for the
; server address the first time, so normally you do not edit this by hand.
; ---------------------------------------------------------------------------
; Address of the AiBoO server (backend), WITHOUT a "/" at the end.
;   other network : the ngrok address, e.g. https://abcd-1234.ngrok-free.dev
;   same network  : http://<server PC IP>:4000, e.g. http://192.168.1.5:4000
remote_url = https://your-ngrok-url.ngrok-free.dev
; Must be the same as AGENT_API_KEY in the server's backend\.env
; (if that line is missing there, keep dev-key-change-in-production).
api_key = dev-key-change-in-production
; Name of this PC on the dashboard. Leave EMPTY = this PC's own name.
; Never copy another PC's name here.
endpoint_name =
server_ip = 127.0.0.1
log_level = INFO
